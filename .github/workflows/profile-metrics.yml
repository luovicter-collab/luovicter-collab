name: profile_metrics

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: luovicter-collab
          filename: output/metrics.svg
          committer_branch: main
          committer_message: "chore: update profile metrics [skip ci]"
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_display: columns
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_lines: yes
          plugin_lines_history_limit: 12
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_charts_type: classic
          plugin_followup: yes
          plugin_repositories: yes
          plugin_repositories_limit: 6

  verify:
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - name: Verify metrics.svg on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for i in 1 2 3 4 5; do
            SIZE=$(gh api repos/luovicter-collab/luovicter-collab/contents/output/metrics.svg --jq .size 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 5000 ]; then
              echo "metrics.svg OK (${SIZE} bytes)"
              exit 0
            fi
            echo "Waiting for metrics commit... attempt $i (size=$SIZE)"
            sleep 15
          done
          echo "metrics.svg missing or too small — metrics job may have failed"
          exit 1
