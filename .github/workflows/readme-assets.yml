name: update_trophies_optional

on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch trophies (non-blocking service)
        continue-on-error: true
        run: |
          curl -fsSL "https://github-profile-trophy.vercel.app/?username=luovicter-collab&theme=gracht&column=4&margin-w=8&margin-h=8&no-bg=true" -o assets/trophies.svg
          test -s assets/trophies.svg

      - uses: EndBug/add-and-commit@v9
        if: success()
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "chore: update trophies svg"
          add: "assets/trophies.svg"
