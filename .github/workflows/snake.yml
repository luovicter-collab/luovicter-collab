name: generate_snake

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: luovicter-collab
          outputs: |
            dist/snake.svg?color_snake=CC785C&color_dots=#E6DFD8,#EFE9DE,#CC785C,#A9583E
            dist/snake-dark.svg?palette=github-dark&color_snake=CC785C

      - uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "chore: update contribution snake"
          add: "dist"
